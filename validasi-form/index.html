<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Validasi Form (Soal H.7)</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 420px; margin: 40px auto; padding: 0 16px; }
    label { display: block; margin-top: 12px; font-weight: bold; }
    input { width: 100%; padding: 8px; box-sizing: border-box; margin-top: 4px; }
    button { margin-top: 16px; padding: 10px 16px; cursor: pointer; }
    .pesan { margin-top: 16px; }
    .error { color: #c62828; }
    .sukses { color: #2e7d32; }
  </style>
</head>
<body>
  <h1>Validasi Form</h1>
  <p>Nama tidak boleh kosong dan nilai harus berada pada rentang 0-100.</p>

  <form id="formValidasi" novalidate>
    <label for="nama">Nama</label>
    <input type="text" id="nama" placeholder="Nama mahasiswa">

    <label for="nilai">Nilai (0-100)</label>
    <input type="number" id="nilai" step="any" placeholder="contoh: 85">

    <button type="submit">Kirim</button>
  </form>

  <p id="pesan" class="pesan"></p>

  <script src="script.js"></script>
</body>
</html>
