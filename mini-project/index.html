<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Project - Kalkulator Nilai Mahasiswa</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; }
    label { display: block; margin-top: 12px; font-weight: bold; }
    input { width: 100%; padding: 8px; box-sizing: border-box; margin-top: 4px; }
    button { margin-top: 16px; padding: 10px 16px; cursor: pointer; }
    .error { color: #c62828; margin-top: 16px; }
    .hasil { margin-top: 16px; padding: 12px; background: #f1f8e9; border-left: 4px solid #689f38; }
    .hasil.gagal { background: #ffebee; border-left-color: #c62828; }
  </style>
</head>
<body>
  <h1>Kalkulator Nilai Mahasiswa</h1>
  <p>Bobot: Tugas 30%, UTS 30%, UAS 40%.</p>

  <form id="formNilai" novalidate>
    <label for="tugas">Nilai Tugas (0-100)</label>
    <input type="number" id="tugas" step="any" placeholder="contoh: 85">

    <label for="uts">Nilai UTS (0-100)</label>
    <input type="number" id="uts" step="any" placeholder="contoh: 78">

    <label for="uas">Nilai UAS (0-100)</label>
    <input type="number" id="uas" step="any" placeholder="contoh: 88">

    <button type="submit">Hitung Nilai Akhir</button>
  </form>

  <div id="hasil" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
